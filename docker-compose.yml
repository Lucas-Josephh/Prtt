services:
  postgres:
    # Même moteur qu'en production (Neon, via Vercel)
    image: postgres:17
    container_name: prtt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prtt
      POSTGRES_PASSWORD: prtt
      POSTGRES_DB: prtt
    ports:
      - "5434:5432"
    volumes:
      - prtt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prtt -d prtt"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  prtt-postgres-data:
