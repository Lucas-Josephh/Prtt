<extranet-navbar />

<div class="app-home">
    <header class="app-home-header">
        <img class="app-home-header_img" src="welcome.jpg" alt="ping pong" />
        <div class="app-home-header_filter"></div>
    </header>
    <div class="app-home-content">
        <h1 class="app-home-content-title">
            <span class="app-home-content-title_white">Bienvenue au Club de</span>
            <span class="app-home-content-title_color">Perpignan Roussillon</span>
        </h1>
        <div class="app-home-content-subtitle">
            <p>Rejoingez notre communauté passionnée et découvrez le tennis de table</p>
            <p>dans une ambiance conviviale et compétitive.</p>
        </div>
        <div class="app-home-content-btn">
            <button class="app-home-content-btn-common app-home-content-btn-common_join">Nous Rejoindre <svg-join /></button>
            <button class="app-home-content-btn-common app-home-content-btn-common_new">Actualités</button>
        </div>
        <div class="app-home-content-stats">
            <div class="app-home-content-stats-container">
                <div class="app-home-content-stats-container_logo">
                    <svg-people [size]="26" />
                </div>
                <p class="app-home-content-stats-container_paragraphe">Plus de 150</p>
                <p class="app-home-content-stats-container_description">Membres Actifs</p>
            </div>
            <div class="app-home-content-stats-container">
                <div class="app-home-content-stats-container_logo">
                    <svg-cup [size]="26" />
                </div>
                <p class="app-home-content-stats-container_paragraphe">25 ans et plus</p>
                <p class="app-home-content-stats-container_description">Titres Gagnés</p>
            </div>
            <div class="app-home-content-stats-container">
                <div class="app-home-content-stats-container_logo">
                    <svg-calendar [size]="26" />
                </div>
                <p class="app-home-content-stats-container_paragraphe">30+</p>
                <p class="app-home-content-stats-container_description">Années d'Existence</p>
            </div>
            <div class="app-home-content-stats-container">
                <div class="app-home-content-stats-container_logo">
                    <svg-star [size]="26" />
                </div>
                <p class="app-home-content-stats-container_paragraphe">8</p>
                <p class="app-home-content-stats-container_description">Tables Disponibles</p>
            </div>
        </div>
    </div>
</div>
